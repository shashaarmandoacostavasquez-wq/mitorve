<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE REAL · Admin</title>

<style>
body{
  margin:0;
  background:#0d0b09;
  color:#fff8ee;
  font-family:system-ui,sans-serif
}
.w{max-width:950px;margin:auto;padding:24px}
.card{
  background:#181411;
  border:1px solid #382e25;
  border-radius:16px;
  padding:18px;
  margin:14px 0
}
.login{max-width:400px;margin:10vh auto}
input,select,button{
  font:inherit;
  padding:11px;
  border-radius:9px
}
input,select{
  width:100%;
  box-sizing:border-box;
  background:#0d0b09;
  color:#fff;
  border:1px solid #4a3b2f;
  margin:6px 0 14px
}
button{
  border:0;
  background:#d6ad6b;
  color:#1b140d;
  font-weight:800;
  cursor:pointer
}
button:disabled{opacity:.55;cursor:not-allowed}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}
.muted{color:#b8aa9c}
.hide{display:none!important}
.order{margin:12px 0}
.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:start
}
.items{
  border-top:1px solid #382e25;
  margin-top:12px;
  padding-top:10px
}
.err{color:#ffb5b5}
.ok{color:#9ee6b8}

@media(max-width:650px){
  .row{display:block}
  .row select{margin-top:12px}
}
</style>
</head>

<body>

<main class="w">

<section id="login" class="card login">
  <h1>THE REAL</h1>
  <p class="muted">Panel privado</p>

  <form id="form">
    <label>Correo</label>
    <input
      id="email"
      type="email"
      required
      autocomplete="username"
    >

    <label>Contraseña</label>
    <input
      id="pass"
      type="password"
      required
      autocomplete="current-password"
    >

    <button id="loginBtn" type="submit">Entrar</button>
    <p id="loginMsg" class="err"></p>
  </form>
</section>

<section id="panel" class="hide">

  <div class="top">
    <div>
      <h1>Pedidos</h1>
      <span class="muted">THE REAL · Administración</span>
    </div>

    <button id="logout">Salir</button>
  </div>

  <div class="card">
    <button id="refresh">Actualizar pedidos</button>
    <span id="msg" class="muted"></span>
  </div>

  <div id="orders"></div>

</section>

</main>

<script>
const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

let token = sessionStorage.getItem('trAdminToken') || '';
let loading = false;


/* =========================
   PANTALLAS
========================= */

function screen(logged){
  $('#login').classList.toggle('hide', logged);
  $('#panel').classList.toggle('hide', !logged);
}


/* =========================
   LIMPIAR SESIÓN
========================= */

function clearSession(){
  token = '';

  sessionStorage.removeItem('trAdminToken');

  $('#orders').innerHTML = '';
  $('#msg').textContent = '';
  $('#loginMsg').textContent = '';

  $('#pass').value = '';

  screen(false);
}


/* =========================
   API
========================= */

async function api(url,opt={}){
  const headers = {
    'Content-Type':'application/json',
    ...(opt.headers || {})
  };

  if(token){
    headers.Authorization = 'Bearer ' + token;
  }

  const response = await fetch(url,{
    ...opt,
    headers,
    cache:'no-store'
  });

  const data = await response.json().catch(()=>({}));

  if(response.status === 401 || response.status === 403){
    const error = new Error(
      data.error || 'Sesión vencida'
    );

    error.auth = true;
    throw error;
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      data.details ||
      'Error del servidor'
    );
  }

  return data;
}


/* =========================
   ESTADOS
========================= */

const STATES = [
  ['pending','Nuevo'],
  ['confirmed','Confirmado'],
  ['preparing','Preparando'],
  ['ready','Listo'],
  ['delivered','Entregado'],
  ['cancelled','Cancelado']
];


/* =========================
   CARGAR PEDIDOS
========================= */

async function load(){

  if(loading) return;

  loading = true;

  $('#refresh').disabled = true;
  $('#msg').textContent = 'Cargando...';

  try{

    const data = await api('/api/admin/orders');

    const orders = Array.isArray(data)
      ? data
      : [];

    $('#orders').innerHTML =
      orders.map(order => {

        const status =
          order.status ||
          order.order_status ||
          'pending';

        const address =
          order.delivery_address ||
          order.address ||
          '';

        const items =
          Array.isArray(order.order_items)
            ? order.order_items
            : [];

        return `
        <article class="card order">

          <div class="row">

            <div>

              <b>
                Pedido #
                ${esc(String(order.id).slice(0,8).toUpperCase())}
              </b>

              · S/
              ${Number(order.total || 0).toFixed(2)}

              <div class="muted">
                ${esc(order.customer_name)}
                ·
                ${esc(order.customer_phone)}
              </div>

              ${
                address
                ? `<div class="muted">${esc(address)}</div>`
                : ''
              }

            </div>

            <select data-id="${esc(order.id)}">

              ${STATES.map(([value,name]) => `
                <option
                  value="${value}"
                  ${status === value ? 'selected' : ''}
                >
                  ${name}
                </option>
              `).join('')}

            </select>

          </div>

          <div class="items">

            ${
              items.length
              ? items.map(item => `
                  <div>
                    ${esc(item.quantity)}
                    ×
                    ${esc(item.product_name)}
                    ${
                      item.presentation
                      ? ` · ${esc(item.presentation)}`
                      : ''
                    }
                  </div>
                `).join('')
              : '<div class="muted">Sin detalle de productos</div>'
            }

          </div>

        </article>
        `;

      }).join('')
      ||
      '<div class="card muted">No hay pedidos.</div>';


    document
      .querySelectorAll('select[data-id]')
      .forEach(select => {

        select.onchange = async () => {

          const previous =
            select.dataset.previous ||
            select.value;

          select.disabled = true;

          $('#msg').textContent =
            'Guardando...';

          try{

            await api(
              '/api/admin/orders/' +
              encodeURIComponent(select.dataset.id),
              {
                method:'PATCH',
                body:JSON.stringify({
                  status:select.value
                })
              }
            );

            select.dataset.previous =
              select.value;

            $('#msg').textContent =
              'Guardado ✓';

          }catch(error){

            select.value = previous;

            if(error.auth){
              clearSession();
              $('#loginMsg').textContent =
                'Tu sesión venció. Inicia sesión nuevamente.';
              return;
            }

            alert(error.message);

            $('#msg').textContent =
              'No se pudo guardar';

          }finally{

            select.disabled = false;

          }

        };

        select.dataset.previous =
          select.value;

      });


    $('#msg').textContent =
      `Listo · ${orders.length} pedido${orders.length === 1 ? '' : 's'}`;

  }catch(error){

    if(error.auth){

      clearSession();

      $('#loginMsg').textContent =
        'Tu sesión venció. Inicia sesión nuevamente.';

      return;
    }

    $('#msg').textContent =
      error.message;

  }finally{

    loading = false;
    $('#refresh').disabled = false;

  }
}


/* =========================
   LOGIN
========================= */

$('#form').onsubmit = async event => {

  event.preventDefault();

  const button = $('#loginBtn');

  button.disabled = true;

  $('#loginMsg').textContent =
    'Ingresando...';

  /*
    IMPORTANTE:
    No enviamos el token viejo al endpoint
    de login.
  */

  const oldToken = token;
  token = '';

  try{

    const data = await api(
      '/api/admin/login',
      {
        method:'POST',
        body:JSON.stringify({
          email:$('#email').value.trim(),
          password:$('#pass').value
        })
      }
    );

    if(!data.access_token){
      throw new Error(
        'El servidor no devolvió una sesión válida'
      );
    }

    token = data.access_token;

    sessionStorage.setItem(
      'trAdminToken',
      token
    );

    $('#loginMsg').textContent = '';

    $('#pass').value = '';

    screen(true);

    await load();

  }catch(error){

    token = '';

    sessionStorage.removeItem(
      'trAdminToken'
    );

    screen(false);

    $('#loginMsg').textContent =
      error.message;

  }finally{

    button.disabled = false;

  }
};


/* =========================
   LOGOUT
========================= */

$('#logout').onclick = () => {

  clearSession();

  /*
    replaceState evita conservar
    estados raros de navegación.
  */

  history.replaceState(
    null,
    '',
    location.pathname
  );

};


/* =========================
   ACTUALIZAR
========================= */

$('#refresh').onclick = load;


/* =========================
   INICIO
========================= */

async function start(){

  if(!token){
    screen(false);
    return;
  }

  /*
    Si existe un token guardado,
    primero lo comprobamos cargando
    pedidos.
  */

  screen(true);

  await load();

}

start();
</script>

</body>
</html>
